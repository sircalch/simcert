[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simcert"
version = "1.6.0"
description = "Unified Quality-Control, Structure Validation, and Reproducibility Meta-Framework for Molecular Simulations & AI Models (MD, Docking, QM, Adsorption, AlphaFold, FEP, QSAR, Catalysis, NEB/Kinetics, Spectroscopy/DOS)"
readme = "README.md"
authors = [
    { name = "Andres Monreal-Hernández", email = "amonreal@example.com" }
]
license = { text = "MIT" }
keywords = [
    "molecular-dynamics",
    "molecular-docking",
    "quantum-chemistry",
    "adsorption",
    "alphafold",
    "free-energy-perturbation",
    "fep",
    "qsar",
    "heterogeneous-catalysis",
    "nudged-elastic-band",
    "chemical-kinetics",
    "spectroscopy",
    "td-dft",
    "uv-vis",
    "infrared-spectroscopy",
    "d-band-center",
    "simulation-quality-control",
    "reproducibility",
    "gromacs",
    "orca",
    "vasp",
    "gaussian"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
requires-python = ">=3.9"
dependencies = [
    "mdcheck>=1.0.0",
    "dockcert>=1.0.0",
    "qmcert>=1.0.0",
    "adsorpqc>=1.0.0",
    "alphacert>=1.0.0",
    "fepcert>=1.0.0",
    "qsarcert>=1.0.0",
    "catcert>=1.0.0",
    "nebcert>=1.0.0",
    "speccert>=1.0.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "jinja2>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "build>=0.10.0",
    "twine>=4.0.0"
]

[project.scripts]
simcert = "simcert.cli:main"

[project.urls]
Homepage = "https://github.com/sircalch/simcert"
Documentation = "https://github.com/sircalch/simcert#readme"
Repository = "https://github.com/sircalch/simcert.git"
"Bug Tracker" = "https://github.com/sircalch/simcert/issues"
Changelog = "https://github.com/sircalch/simcert/blob/main/CHANGELOG.md"

