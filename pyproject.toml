[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simcert"
version = "1.0.0"
description = "Unified Quality-Control, Stationary Point Certification, and Reproducibility Meta-Framework for Molecular Simulations (MD, Docking, QM, Adsorption)"
readme = "README.md"
authors = [
    { name = "Andre Monreal-Hernández", email = "amonreal@example.com" }
]
license = { text = "MIT" }
keywords = [
    "molecular-dynamics",
    "molecular-docking",
    "quantum-chemistry",
    "adsorption",
    "simulation-quality-control",
    "reproducibility",
    "gromacs",
    "orca",
    "gaussian",
    "autodock-vina",
    "raspa",
    "computational-chemistry"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
requires-python = ">=3.9"
dependencies = [
    "mdcheck>=1.0.0",
    "dockcert>=1.0.0",
    "qmcert>=1.0.0",
    "adsorpqc>=1.0.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "jinja2>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "build>=0.10.0",
    "twine>=4.0.0"
]

[project.scripts]
simcert = "simcert.cli:main"

[project.urls]
Homepage = "https://github.com/amonreal/simcert"
Documentation = "https://github.com/amonreal/simcert#readme"
Repository = "https://github.com/amonreal/simcert.git"
"Bug Tracker" = "https://github.com/amonreal/simcert/issues"
Changelog = "https://github.com/amonreal/simcert/blob/main/CHANGELOG.md"
