name: Test SimCert Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Sibling certifiers are not all on PyPI yet; install them from their tagged GitHub releases.
        for p in mdcheck dockcert qmcert adsorpqc alphacert fepcert qsarcert catcert nebcert speccert; do
          pip install "$p @ git+https://github.com/sircalch/$p@v1.0.0"
        done
        pip install -e .[dev]

    - name: Run tests with pytest
      run: |
        pytest tests/ --cov=simcert --cov-report=term-missing
